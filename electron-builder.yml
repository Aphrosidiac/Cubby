appId: studio.ffdev.cubby
productName: Cubby
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/.vscode/*'
  - '!.claude/**'
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
extraResources:
  - from: resources
    to: resources
fileAssociations:
  - ext: brand
    name: Cubby brand export
    description: Cubby brand export
    icon: icon
    role: Editor
win:
  executableName: Cubby
  icon: build/icon.ico
  files:
    - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
    - '!node_modules/ffprobe-static/bin/win32/ia32/**'
  target: [nsis]
nsis:
  artifactName: Cubby-${version}-setup.${ext}
  shortcutName: Cubby
  uninstallDisplayName: Cubby
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target: [dmg]
  icon: build/icon.png
  files:
    - '!node_modules/ffprobe-static/bin/{win32,linux}/**'
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Cubby-${version}-${arch}.${ext}
npmRebuild: false
publish: null
