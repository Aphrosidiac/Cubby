<!doctype html>
<html><head><meta charset="utf-8"><title>Page two</title></head>
<body><h1>Page two</h1><input id="search" placeholder="Search"><button id="find">Find</button><div id="out"></div>
<script>
  document.getElementById('find').onclick = () => { document.getElementById('out').innerText = 'Found: ' + document.getElementById('search').value; };
  document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('out').innerText = 'Entered: ' + e.target.value; });
</script></body></html>
