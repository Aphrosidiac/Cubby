<!doctype html>
<!-- Mimics the STRUCTURE the X recipe expects. Test fixture only. -->
<html><head><meta charset="utf-8"><title>Post / X</title><style>.hidden{display:none}</style></head><body>
<nav><a href="/__HANDLE__" data-testid="AppTabBar_Profile_Link">Profile</a></nav>
<div role="dialog">
  <div data-testid="tweetTextarea_0" contenteditable="true" role="textbox" style="min-height:40px;border:1px solid #ccc"></div>
  <input type="file" data-testid="fileInput" multiple accept="image/*,video/*" style="display:none">
  <div id="att"></div>
  <button data-testid="tweetButton" id="tb">Post</button>
</div>
<div data-testid="toast" id="toast" class="hidden">Your post was sent. <a href="/__HANDLE__/status/1234567890">View</a></div>
<script>
  const tb = document.getElementById('tb');
  document.querySelector('[data-testid=fileInput]').onchange = (e) => { tb.disabled = true; document.getElementById('att').innerText = Array.from(e.target.files).map(f => f.name).join(','); setTimeout(() => { tb.disabled = false; }, 600); };
  tb.onclick = () => { window.__text = document.querySelector('[data-testid=tweetTextarea_0]').innerText; window.__att = document.getElementById('att').innerText; setTimeout(() => document.getElementById('toast').classList.remove('hidden'), 300); };
</script>
</body></html>
