<!doctype html>
<!-- Generic mechanics fixture: hidden inputs, chooser-only upload, prefilled editors, late buttons. -->
<html><head><meta charset="utf-8"><title>Kit fixture</title></head><body>
<input type="file" id="hidden1" style="display:none">
<button id="chooserBtn">Choose files</button>
<div id="chosen"></div>
<textarea id="ta">old text</textarea>
<div contenteditable="true" id="ce" style="min-height:40px;border:1px solid #ccc">my-video-final_v3</div>
<button id="late" disabled>Publish</button>
<div id="status"></div>
<script>
  document.getElementById('hidden1').onchange = (e) => { document.getElementById('chosen').innerText = 'input:' + e.target.files.length; };
  // chooser-only upload: the input is created on demand and never attached to the DOM
  document.getElementById('chooserBtn').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.onchange = () => { document.getElementById('chosen').innerText = 'chooser:' + i.files.length; }; i.click(); };
  setTimeout(() => { document.getElementById('late').disabled = false; }, 500);
  document.getElementById('late').onclick = () => setTimeout(() => { document.getElementById('status').innerText = 'Your post was published'; }, 300);
</script>
</body></html>
